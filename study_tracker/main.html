<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Study Tracker 09115</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="../icon.webp">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body>
        <main>
            <div class="card" style="width: 95vw;">
                <h1>
                    Study Planer
                </h1>
                <div class="flex_container">
                    <div>
                        <div class="card" style="width: 45vw;">
                            <p>Add in a new subject or select an existing one</p>
                            <section>
                                <label for="subject-select">Subject:</label>
                                <select id="subject-select"></select>
                                <br>
                                <label for="new-subject-input">Alternatively, Add a custom subject</label>
                                <br>
                                <input id="new-subject-input" type="text" placeholder="Add a custom subject">
                                <button id="add-subject-btn">Add Subject</button>
                            </section>
                        </div>
                        <br>
                        <div class="card">
                            <label for="minutes-input">Number of minutes studied: </label>
                            <input id="minutes-input" type="number" placeholder="Time Studied">
                        </div>
                        <br>
                        <div class="card">
                            <label for="unit-input">Number of units read: </label>
                            <input id="unit-input" type="number" placeholder="Units Read">
                        </div>
                        <br>
                        <button id="log-session-btn">
                            <h2>Log Session</h2>
                        </button>
                    </div>
                    <div class="card" style="width: 35vw;"> 
                        <h2>Current Subjects</h2>
                        <div class="scrollable_box" id="subject-list">
                            JavaScript Error - Did Not Render
                        </div>
                    </div>
                </div>
                <br><hr><br>
                <div class="flex_container">
                    <div>
                        <h2>History</h2>
                        <br>
                        <div class="scrollable_box" id="session-tracker" style="width: 40vw;">
                            JavaScript Error - Did Not Render
                        </div>
                    </div>
                    <div>
                        <h2>Statistics</h2>
                        <div class="scrollable_box" id="subject-calc" style="width: 40vw;">
                            JavaScript Error - Did Not Render
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
