<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Study Tracker 09115</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="../icon.webp">
    </head>
    <body>
        <main>
            <div class="card" style="width: 95vw;">
                <h1>
                    Study Planer (Very early WIP)
                </h1>
                <div class="flex-container">
                    <div>
                        <div class="card">
                            <p>Add in a new subject or select an existing one</p>
                            <section>
                                <label for="subject-select">Subject:</label>
                                <select id="subject-select"><!-- filled in by JS on page load --></select>
                                <br>
                                <label for="new-subject-input">Alternatively, Add a custom subject</label>
                                <input id="new-subject-input" type="text" placeholder="Add a custom subject">
                                <button id="add-subject-btn">Add Subject</button>
                            </section>
                        </div>
                        <br>
                        <div class="card">
                            <label for="minutes-input">Number of minutes studided: </label>
                            <input id="minutes-input" type="number" placeholder="Time studied">
                        </div>
                        <br>
                        <button id="log-session-btn">
                            <h2>Log Session</h2>
                        </button>
                    </div>
                    <div class="card"> 
                        <h2>Current Subjects</h2>
                        <div class="scrollable_box">
                            placeholder
                        </div>
                    </div>
                </div>
                <div class="flex-container">
                    <h2>History</h2>
                    <ul id="session-list"><!-- filled in by JS --></ul>
                </div>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
